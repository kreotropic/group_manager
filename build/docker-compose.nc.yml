#
# Disposable Nextcloud instance for checking Group Manager against one
# specific version out of the range it declares in appinfo/info.xml. SQLite and
# no Redis: the app has no tables of its own and does not use a distributed
# cache -- what varies between Nextcloud versions is the group/backend API, the
# Team Folders (groupfolders) app it drives, and user_ldap, so those are what
# each instance carries. The LDAP server is a public test image pre-loaded with
# users and groups (Planet Express), so the LDAP paths can be exercised without
# a directory of your own. See build/README.md.
#
# Not meant to be brought up by hand: NC_VERSION, NC_PORT and INFO_XML must be
# set in the environment, which build/nc-instance.sh does. Each version gets its
# own project name, so several can run side by side.
services:
  ldap:
    image: ghcr.io/rroemhild/docker-test-openldap:master
    container_name: groupmgr-nc${NC_VERSION}-ldap
    restart: unless-stopped

  app:
    image: nextcloud:${NC_VERSION}-apache
    container_name: groupmgr-nc${NC_VERSION}-app
    restart: unless-stopped
    ports:
      - "${NC_PORT}:80"
    depends_on:
      - ldap
    volumes:
      - nextcloud:/var/www/html
      # Only this app. groupfolders (which the Folders tab drives) is installed
      # from the App Store by nc-instance.sh, so each Nextcloud version gets the
      # release built for it.
      - ..:/var/www/html/custom_apps/group_manager
      # The app's own info.xml with its <nextcloud> range widened to this exact
      # version (generated by nc-instance.sh). Nextcloud refuses to enable an
      # app outside its declared range, and `occ app:enable --force` only waives
      # max-version, never min-version -- so without this, a version outside the
      # declared range could not be tested at all. The file in the repo is left
      # alone; only this container sees the widened copy.
      - ${INFO_XML}:/var/www/html/custom_apps/group_manager/appinfo/info.xml:ro
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=ncadmin
      - NEXTCLOUD_ADMIN_PASSWORD=groupmgr-nc${NC_VERSION}-verify
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost

volumes:
  # Compose does not interpolate variables inside mapping keys, only in values
  # -- this key must stay fixed. It doesn't collide between versions because
  # `docker compose -p groupmgr-ncNN` prefixes it with the project name.
  nextcloud:
